name: Rebuild IPs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild IPs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/rebuild_ips.py
      - name: Commit changes
        run: |
          git add aws-ips.txt all-ips.txt database.json scripts/cache.json
          if git diff --cached --quiet; then
            echo "IP files are already up to date."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Rebuild IP databases"
            git push
          fi
