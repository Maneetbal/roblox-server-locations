name: Rebuild AWS IP ranges

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-aws-ips
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild aws-ips.txt from official AWS feeds
        run: python scripts/rebuild_aws_ips.py

      - name: Commit changes
        run: |
          if git diff --quiet -- aws-ips.txt; then
            echo "aws-ips.txt is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws-ips.txt
          git commit -m "Update AWS IP ranges"
          git push
