name: Rebuild AWS IPs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rebuild_aws_ips.py
      - name: Commit changes
        run: |
          git add aws-ips.txt
          if git diff --cached --quiet; then
            echo "aws-ips.txt is already up to date."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Rebuild AWS IP ranges"
            git push
          fi
