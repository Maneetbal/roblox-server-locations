name: Publish raw JSON API

on:
  push:
    branches: [main]
    paths:
      - all-ips.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate database
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          coords = {
              "Ashburn, VA":"39.0438,-77.4874","Atlanta, GA":"33.7490,-84.3880","Boardman, OR":"45.8399,-119.7006",
              "Chicago, IL":"41.8781,-87.6298","Columbus, OH":"39.9612,-82.9988","Dallas, TX":"32.7767,-96.7970",
              "Los Angeles, CA":"34.0522,-118.2437","Miami, FL":"25.7617,-80.1918","New York City, NY":"40.7128,-74.0060",
              "San Jose, CA":"37.3382,-121.8863","Seattle, WA":"47.6062,-122.3321","Buenos Aires, AR":"-34.6037,-58.3816",
              "Sydney, AU":"-33.8688,151.2093","Sao Paulo, BR":"-23.5505,-46.6333","Santiago, CL":"-33.4489,-70.6693",
              "Paris, FR":"48.8566,2.3522","Frankfurt, DE":"50.1109,8.6821","Mumbai, IN":"19.0760,72.8777",
              "Dublin, IE":"53.3498,-6.2603","Tel Aviv, IL":"32.0853,34.7818","Osaka, JP":"34.6937,135.5023",
              "Tokyo, JP":"35.6762,139.6503","Kuala Lumpur, MY":"3.1390,101.6869","Queretaro, MX":"20.5888,-100.3899",
              "Amsterdam, NL":"52.3676,4.9041","Singapore, SG":"1.3521,103.8198","Zurich, CH":"47.3769,8.5417",
              "Istanbul, TR":"41.0082,28.9784","London, UK":"51.5072,-0.1276"
          }
          states = {"VA":"Virginia","GA":"Georgia","OR":"Oregon","IL":"Illinois","OH":"Ohio","TX":"Texas","CA":"California","FL":"Florida","NY":"New York","WA":"Washington"}
          regions = {
              "Sydney, AU":"New South Wales","Sao Paulo, BR":"São Paulo","Santiago, CL":"Santiago Metropolitan Region",
              "Paris, FR":"Île-de-France","Frankfurt, DE":"Hesse","Mumbai, IN":"Maharashtra","Dublin, IE":"Leinster",
              "Tel Aviv, IL":"Tel Aviv District","Osaka, JP":"Osaka Prefecture","Tokyo, JP":"Tokyo",
              "Kuala Lumpur, MY":"Federal Territory of Kuala Lumpur","Queretaro, MX":"Querétaro",
              "Amsterdam, NL":"North Holland","Zurich, CH":"Zurich","Istanbul, TR":"Istanbul","London, UK":"England",
              "Buenos Aires, AR":"Buenos Aires"
          }
          rows, country, city = [], "", ""
          lines = Path("all-ips.txt").read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if re.fullmatch(r"[A-Za-z][A-Za-z .'-]+", line) and i + 1 < len(lines) and re.fullmatch(r"[-=]{3,}", lines[i + 1]):
                  country, city = line.strip(), ""
                  continue
              match = re.match(r"^\s*-\s+(.+?)(?:\s+\(Reserved\))?$", line)
              if match and not re.match(r"\d{1,3}(?:\.\d{1,3}){3}", match.group(1)):
                  city = match.group(1).strip()
                  continue
              match = re.match(r"^\s*-\s+((?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?)(.*)$", line)
              if match and city and country:
                  code = re.search(r",\s*([A-Z]{2})$", city)
                  region = regions.get(city) or (states.get(code.group(1), code.group(1)) if country == "United States" and code else "")
                  rows.append({
                      "ip": match.group(1), "city": re.sub(r",\s*[A-Z]{2}$", "", city),
                      "region": region, "country": country, "loc": coords.get(city, ""),
                      "org": "Amazon AWS" if re.search(r"\\(AWS\\b", match.group(2)) is not None else "AS22697 Roblox"
                  })
          if not rows:
              raise SystemExit("No IP records were generated")
          Path("out/v1").mkdir(parents=True, exist_ok=True)
          Path("out/v1/database.json").write_text(json.dumps(rows, separators=(",", ":")), encoding="utf-8")
          PY
      - name: Publish to api branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch api "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" api-branch
          mkdir -p api-branch/v1
          cp out/v1/database.json api-branch/v1/database.json
          git -C api-branch config user.name "github-actions[bot]"
          git -C api-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C api-branch add v1/database.json
          if ! git -C api-branch diff --cached --quiet; then
            git -C api-branch commit -m "Update raw JSON database"
            git -C api-branch push
          fi
